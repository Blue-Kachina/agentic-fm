name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fm-saxml: the solution context module (solution_context.py) reads its docs.
      # Keep the version in step with the DIS harness's requirements.txt.
      - name: Install pytest and fm-saxml
        run: python -m pip install pytest fm-saxml-converter==0.6.6

      # test_deploy.py needs a running companion server, so it is not run here.
      - name: Run tests
        run: python -m pytest agent/scripts --ignore=agent/scripts/test_deploy.py -p no:cacheprovider
